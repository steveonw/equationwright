name: package-v7.3-release

on:
  push:
    branches:
      - main
    paths:
      - 'releases/v7.3/**'
      - '!releases/v7.3/EquationWright_v7_3_FINAL_APPROVED.zip'
      - '!releases/v7.3/SHA256SUMS.txt'
      - 'scripts/package_release.py'
      - '.github/workflows/package-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build approved v7.3 package
        run: >-
          python scripts/package_release.py releases/v7.3
          --package-name EquationWright_v7_3_FINAL_APPROVED.zip

      - name: Verify user manual is packaged
        shell: bash
        run: |
          python - <<'PY'
          import zipfile
          package = 'releases/v7.3/EquationWright_v7_3_FINAL_APPROVED.zip'
          expected = 'EquationWright_v7_3_FINAL_APPROVED/EquationWright_v7_3_Complete_User_Manual_with_Developer_Notes.pdf'
          with zipfile.ZipFile(package) as zf:
              if expected not in zf.namelist():
                  raise SystemExit(f'missing packaged manual: {expected}')
          print('manual packaged:', expected)
          PY

      - name: Ensure landing page links complete package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          package_href = 'releases/v7.3/EquationWright_v7_3_FINAL_APPROVED.zip'
          if package_href not in text:
              needle = '                📖 <a href="EquationWright_v7_3_Complete_User_Manual_with_Developer_Notes.pdf" target="_blank" rel="noopener">Full User Manual (PDF)</a> • '
              replacement = (
                  '                📦 <a href="' + package_href + '" download>Download Complete v7.3 Package (ZIP)</a> • \n'
                  + needle
              )
              if needle not in text:
                  raise SystemExit('could not find Resources & Documentation insertion point in index.html')
              text = text.replace(needle, replacement, 1)
              path.write_text(text, encoding='utf-8')
              print('added package download link to index.html')
          else:
              print('package download link already present')
          PY

      - name: Commit refreshed package
        shell: bash
        run: |
          if git diff --quiet -- index.html releases/v7.3/SHA256SUMS.txt releases/v7.3/EquationWright_v7_3_FINAL_APPROVED.zip; then
            echo 'Release package and landing page already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html releases/v7.3/SHA256SUMS.txt releases/v7.3/EquationWright_v7_3_FINAL_APPROVED.zip
          git commit -m 'Publish v7.3 package with user manual'
          git push
