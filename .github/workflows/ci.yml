name: repository-checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python audit dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Check repository inventory
        run: python scripts/check_repo.py --allow-missing-generated

      - name: Run available audits
        continue-on-error: true
        run: python scripts/run_all_audits.py --allow-missing

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"

      - name: Build Go gateway
        working-directory: gateway
        run: go build ./...
