<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalChat — talk to your own machine</title>
<style>
:root{ --bg:#0b1020; --panel:#111831; --line:#26304f; --text:#e8ecf8; --dim:#8fa0c9;
       --me:#1d4ed8; --bot:#1a2440; --accent:#34d399; --err:#f87171; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--text);
      font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      display:flex; flex-direction:column; height:100dvh; }
header{ display:flex; align-items:center; gap:10px; padding:10px 14px;
        border-bottom:1px solid var(--line); background:var(--panel); }
header h1{ font-size:16px; margin:0; font-weight:900; }
#dot{ width:10px; height:10px; border-radius:50%; background:#777; flex:0 0 auto; }
#dot.on{ background:var(--accent); } #dot.off{ background:var(--err); }
#statusTxt{ font-size:12px; color:var(--dim); flex:1; min-width:0;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
button{ background:#1b2547; color:var(--text); border:1px solid var(--line);
        border-radius:10px; padding:8px 12px; font-weight:800; cursor:pointer; }
button:hover{ border-color:var(--accent); }
button:disabled{ opacity:0.5; cursor:default; }
#settings{ display:none; padding:12px 14px; border-bottom:1px solid var(--line);
           background:var(--panel); }
#settings.open{ display:block; }
.sRow{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
.sField{ flex:1; min-width:180px; }
.sField label{ display:block; font-size:11px; font-weight:900; color:var(--dim);
               text-transform:uppercase; margin-bottom:3px; }
.sField input, .sField textarea{ width:100%; background:#0d1428; color:var(--text);
        border:1px solid var(--line); border-radius:8px; padding:8px; font-size:14px; }
.sField textarea{ resize:vertical; min-height:38px; font-family:inherit; }
#chat{ flex:1; overflow-y:auto; padding:16px 14px; display:flex;
       flex-direction:column; gap:10px; }
.msg{ max-width:min(720px,88%); padding:10px 14px; border-radius:14px;
      white-space:pre-wrap; overflow-wrap:anywhere; }
.msg.me{ align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; }
.msg.bot{ align-self:flex-start; background:var(--bot); border:1px solid var(--line);
          border-bottom-left-radius:4px; }
.msg.sys{ align-self:center; background:transparent; color:var(--dim); font-size:12px;
          text-align:center; padding:2px; }
.msg.err{ align-self:flex-start; background:rgba(248,113,113,0.12);
          border:1px solid var(--err); color:#fecaca; font-size:13px; }
.msg code{ background:#0d1428; padding:1px 5px; border-radius:5px;
           font-family:ui-monospace,Consolas,monospace; font-size:13px; }
.meta{ font-size:10.5px; color:var(--dim); margin-top:5px; }
#composer{ display:flex; gap:8px; padding:10px 14px 14px;
           border-top:1px solid var(--line); background:var(--panel); }
#input{ flex:1; background:#0d1428; color:var(--text); border:1px solid var(--line);
        border-radius:12px; padding:10px 12px; font:inherit; resize:none;
        min-height:44px; max-height:160px; }
#send{ background:var(--accent); color:#062015; border:none; min-width:74px; }
@media (max-width:640px){ .msg{ max-width:94%; } header h1{ display:none; } }
</style>
</head>
<body>

<header>
  <div id="dot"></div>
  <h1>LocalChat</h1>
  <div id="statusTxt">checking gateway…</div>
  <button id="newBtn" title="Clear the conversation">New chat</button>
  <button id="gearBtn" title="Connection settings">Settings</button>
</header>

<div id="settings">
  <div class="sRow">
    <div class="sField" style="flex:2">
      <label>Endpoint (your gateway / any OpenAI-compatible server)</label>
      <input id="setUrl" placeholder="http://127.0.0.1:8090/v1/chat/completions">
    </div>
    <div class="sField" style="max-width:140px">
      <label>API key</label>
      <input id="setKey" placeholder="54">
    </div>
    <div class="sField" style="max-width:160px">
      <label>Model (optional)</label>
      <input id="setModel" placeholder="local">
    </div>
  </div>
  <div class="sRow">
    <div class="sField" style="flex:2">
      <label>System prompt (the assistant's standing instructions)</label>
      <textarea id="setSys">You are a helpful assistant running locally on the user's own computer. Be concise.</textarea>
    </div>
    <div class="sField" style="max-width:110px">
      <label>Temperature</label>
      <input id="setTemp" type="number" step="0.1" min="0" max="2" value="0.7">
    </div>
    <div class="sField" style="max-width:110px">
      <label>Max tokens</label>
      <input id="setMax" type="number" min="16" max="8192" value="1024">
    </div>
  </div>
  <button id="saveBtn">Save settings</button>
  <span style="font-size:12px; color:var(--dim); margin-left:8px">
    Saved in this browser only. Nothing ever leaves your machine unless your endpoint does.
  </span>
</div>

<div id="chat"></div>

<div id="composer">
  <textarea id="input" placeholder="Say something… (Enter to send, Shift+Enter for a new line)"></textarea>
  <button id="send">Send</button>
</div>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };

// ---------- settings ----------
var DEFAULTS = {
  url: (location.protocol === "http:" || location.protocol === "https:") && location.port
        ? location.origin + "/v1/chat/completions"
        : "http://127.0.0.1:8090/v1/chat/completions",
  key: "54", model: "local",
  sys: "You are a helpful assistant running locally on the user's own computer. Be concise.",
  temp: 0.7, max: 1024
};
var S = DEFAULTS;
try { S = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem("LC_SETTINGS") || "{}")); } catch(e){}

function fillSettings(){
  $("setUrl").value = S.url; $("setKey").value = S.key; $("setModel").value = S.model;
  $("setSys").value = S.sys; $("setTemp").value = S.temp; $("setMax").value = S.max;
}
function saveSettings(){
  S = { url: $("setUrl").value.trim() || DEFAULTS.url,
        key: $("setKey").value.trim(),
        model: $("setModel").value.trim() || "local",
        sys: $("setSys").value,
        temp: parseFloat($("setTemp").value) || 0.7,
        max: parseInt($("setMax").value, 10) || 1024 };
  try { localStorage.setItem("LC_SETTINGS", JSON.stringify(S)); } catch(e){}
  $("settings").classList.remove("open");
  ping();
}

// ---------- conversation ----------
var HISTORY = [];
try { HISTORY = JSON.parse(localStorage.getItem("LC_CHAT") || "[]"); } catch(e){}
function persist(){ try { localStorage.setItem("LC_CHAT", JSON.stringify(HISTORY.slice(-40))); } catch(e){} }

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function mdLite(s){
  // escape first, then a little formatting: `code` and **bold**
  s = esc(s);
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  return s;
}
function addBubble(role, text, meta){
  var d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = mdLite(text) + (meta ? '<div class="meta">' + esc(meta) + "</div>" : "");
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
  return d;
}
function redraw(){
  $("chat").innerHTML = "";
  if (!HISTORY.length){
    addBubble("sys", "Fresh chat. Your words go to the endpoint in Settings — nowhere else.");
  }
  HISTORY.forEach(function(m){ addBubble(m.role === "user" ? "me" : "bot", m.content); });
}

// ---------- gateway status ----------
function ping(){
  var base = S.url.replace(/\/v1\/chat\/completions\/?$/, "/");
  fetch(base, { method: "GET" }).then(function(r){ return r.json(); }).then(function(j){
    $("dot").className = "on";
    var extra = (j && j.backend) ? (" → " + j.backend.replace(/^https?:\/\//,"")) : "";
    $("statusTxt").textContent = "connected: " + base.replace(/^https?:\/\//,"") + extra;
  }).catch(function(){
    $("dot").className = "off";
    $("statusTxt").textContent = "can't reach " + S.url + " — is the gateway on?";
  });
}

// ---------- sending ----------
var busy = false;
function send(){
  if (busy) return;
  var text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  HISTORY.push({ role: "user", content: text });
  persist(); addBubble("me", text);
  var thinking = addBubble("sys", "thinking…");
  busy = true; $("send").disabled = true;
  var finish = function(){ busy = false; $("send").disabled = false; $("input").focus(); };

  var msgs = [{ role: "system", content: S.sys }].concat(HISTORY.slice(-20));
  var t0 = Date.now();
  fetch(S.url, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + S.key },
    body: JSON.stringify({ model: S.model, messages: msgs,
                           temperature: S.temp, max_tokens: S.max })
  }).then(function(r){
    return r.json().then(function(j){ return { ok: r.ok, status: r.status, j: j }; });
  }).then(function(res){
    thinking.remove();
    if (!res.ok){
      var msg = (res.j && res.j.error && res.j.error.message) || ("HTTP " + res.status);
      addBubble("err", "Gateway said: " + msg +
        (res.status === 401 ? " — check the API key in Settings." : ""));
    } else {
      var out = (res.j.choices && res.j.choices[0] && res.j.choices[0].message &&
                 res.j.choices[0].message.content) || "(empty reply)";
      HISTORY.push({ role: "assistant", content: out });
      persist();
      addBubble("bot", out, ((Date.now() - t0) / 1000).toFixed(1) + "s · local");
    }
    finish();
  }).catch(function(e){
    thinking.remove();
    addBubble("err", "Couldn't reach the endpoint (" + e.message + "). " +
      "Is the gateway on? If you opened this file directly and it won't connect, " +
      "use the built-in copy at http://127.0.0.1:8090/chat");
    finish();
  });
}

// ---------- wiring ----------
$("send").addEventListener("click", send);
$("input").addEventListener("keydown", function(ev){
  if (ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); send(); }
});
$("gearBtn").addEventListener("click", function(){
  $("settings").classList.toggle("open");
});
$("saveBtn").addEventListener("click", saveSettings);
$("newBtn").addEventListener("click", function(){
  HISTORY = []; persist(); redraw();
});

fillSettings(); redraw(); ping();
setInterval(ping, 20000);
})();
</script>
</body>
</html>
